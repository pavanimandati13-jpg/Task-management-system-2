<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Task Manager</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1"><i class="fa-solid fa-list-check me-2"></i>TaskFlow Pro</span>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <!-- Stats Dashboard -->
        <div class="row text-center mb-4">
          <div class="col-4">
            <div class="card border-0 shadow-sm pad-card">
              <h6 class="text-muted small text-uppercase">Total</h6>
              <h3 id="statTotal" class="fw-bold text-primary mb-0">0</h3>
            </div>
          </div>
          <div class="col-4">
            <div class="card border-0 shadow-sm pad-card">
              <h6 class="text-muted small text-uppercase">Pending</h6>
              <h3 id="statPending" class="fw-bold text-warning mb-0">0</h3>
            </div>
          </div>
          <div class="col-4">
            <div class="card border-0 shadow-sm pad-card">
              <h6 class="text-muted small text-uppercase">Completed</h6>
              <h3 id="statCompleted" class="fw-bold text-success mb-0">0</h3>
            </div>
          </div>
        </div>

        <!-- Task Input Card -->
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h5 class="card-title mb-3">Add New Task</h5>
            <form id="taskForm">
              <div class="mb-3">
                <input type="text" id="taskTitle" class="form-control form-control-lg" placeholder="What needs to be done?" required />
              </div>
              <div class="row g-2 mb-3">
                <div class="col-md-4">
                  <select id="taskPriority" class="form-select">
                    <option value="Low">Low Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="High">High Priority</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <select id="taskCategory" class="form-select">
                    <option value="Work">Work</option>
                    <option value="Personal">Personal</option>
                    <option value="Study">Study</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <input type="date" id="taskDueDate" class="form-control" />
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100 fw-bold"><i class="fa-solid fa-plus me-1"></i> Add Task</button>
            </form>
          </div>
        </div>

        <!-- Task List -->
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="card-title mb-0">Your Tasks</h5>
              <button id="clearAllBtn" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-trash me-1"></i> Clear All</button>
            </div>
            <ul id="taskList" class="list-group list-group-flush"></ul>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
