<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Task Launcher</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container d-flex justify-content-between">
      <span class="navbar-brand mb-0 h1"><i class="fa-solid fa-bolt text-warning me-2"></i>Task Execution Hub</span>
      <div>
        <button id="focusSoundBtn" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-headphones me-1"></i> Toggle Focus Audio</button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <!-- Task Creator Form -->
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body p-4">
            <h5 class="card-title mb-3"><i class="fa-solid fa-plus-circle me-2"></i>Create Executable Task</h5>
            <form id="actionTaskForm">
              <div class="mb-3">
                <label class="form-label fw-bold">Task Description</label>
                <input type="text" id="taskTitle" class="form-control" placeholder="e.g., Edit Project Document, Review GitHub Repo" required />
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Action URL (Website to open when executed)</label>
                <input type="url" id="taskUrl" class="form-control" placeholder="https://docs.google.com or https://github.com" required />
              </div>
              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold">Target Duration (Minutes)</label>
                  <input type="number" id="taskDuration" class="form-control" value="25" min="1" max="180" />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Category</label>
                  <select id="taskCategory" class="form-select">
                    <option value="Coding">Coding / GitHub</option>
                    <option value="Research">Research / Reading</option>
                    <option value="Writing">Writing / Docs</option>
                    <option value="Meeting">Meeting / Call</option>
                  </select>
                </div>
              </div>
              <button type="submit" class="btn btn-success w-100 fw-bold"><i class="fa-solid fa-rocket me-1"></i> Save Executable Task</button>
            </form>
          </div>
        </div>

        <!-- Task List -->
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <h5 class="card-title mb-3"><i class="fa-solid fa-list-check me-2"></i>Active Work Dashboard</h5>
            <div id="taskList"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <audio id="audioPlayer" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"></audio>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
