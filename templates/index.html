<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background-color: #f8f9fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
    }

    /* Landing Page Styling */
    #landingPage {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
      text-align: center;
      padding: 20px;
    }

    .landing-icon {
      font-size: 4rem;
      color: #0d6efd;
      margin-bottom: 20px;
    }

    .landing-card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      max-width: 450px;
      width: 100%;
    }

    /* Dashboard Styling */
    #dashboardPage {
      display: none; /* Hidden by default until clicked */
    }

    .stat-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .stat-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: #6c757d;
      letter-spacing: 0.5px;
    }
    .stat-number {
      font-size: 1.8rem;
      font-weight: 700;
    }
    .card-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      margin-bottom: 24px;
    }
    .task-item {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #e9ecef;
    }
    .badge-high { background-color: #f8d7da; color: #721c24; }
    .badge-medium { background-color: #fff3cd; color: #856404; }
    .badge-low { background-color: #d1e7dd; color: #0f5132; }
    .badge-cat { background-color: #6c757d; color: #ffffff; }
  </style>
</head>
<body class="py-4">

  <!-- PAGE 1: LANDING / WELCOME PAGE -->
  <div id="landingPage">
    <div class="landing-card">
      <div class="landing-icon">
        <i class="fa-solid fa-list-check"></i>
      </div>
      <h2 class="fw-bold mb-3">Task Management System</h2>
      <p class="text-muted mb-4">
        Organize your work, track priorities, and stay productive every day.
      </p>
      <button class="btn btn-primary btn-lg w-100 py-3 fw-bold rounded-pill" onclick="openDashboard()">
        Get Started <i class="fa-solid fa-arrow-right ms-2"></i>
      </button>
    </div>
  </div>


  <!-- PAGE 2: TASK MANAGEMENT DASHBOARD -->
  <div id="dashboardPage" class="container" style="max-width: 500px;">
    
    <!-- Header with Back Button -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="openLanding()">
        <i class="fa-solid fa-arrow-left me-1"></i> Home
      </button>
      <h6 class="fw-bold mb-0 text-muted">Task Dashboard</h6>
    </div>

    <!-- Top Stats Counter Cards -->
    <div class="row g-2 mb-4">
      <div class="col-4">
        <div class="stat-card">
          <div class="stat-title">TOTAL</div>
          <div class="stat-number text-primary" id="totalCount">0</div>
        </div>
      </div>
      <div class="col-4">
        <div class="stat-card">
          <div class="stat-title">PENDING</div>
          <div class="stat-number text-warning" id="pendingCount">0</div>
        </div>
      </div>
      <div class="col-4">
        <div class="stat-card">
          <div class="stat-title">COMPLETED</div>
          <div class="stat-number text-success" id="completedCount">0</div>
        </div>
      </div>
    </div>

    <!-- Add New Task Form -->
    <div class="card-box">
      <h5 class="fw-bold mb-3">Add New Task</h5>
      <form id="taskForm">
        <div class="mb-3">
          <input type="text" id="taskTitle" class="form-control form-control-lg" placeholder="What needs to be done?" required />
        </div>
        <div class="mb-3">
          <select id="taskPriority" class="form-select">
            <option value="High">High Priority</option>
            <option value="Medium">Medium Priority</option>
            <option value="Low">Low Priority</option>
          </select>
        </div>
        <div class="mb-3">
          <select id="taskCategory" class="form-select">
            <option value="Study">Study</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
          </select>
        </div>
        <div class="mb-3">
          <input type="url" id="taskLink" class="form-control" placeholder="Optional URL/Link (e.g. https://...)" />
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold"><i class="fa-solid fa-plus me-1"></i> Add Task</button>
      </form>
    </div>

    <!-- Your Tasks List -->
    <div class="card-box">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Your Tasks</h5>
        <button class="btn btn-outline-danger btn-sm" onclick="clearAllTasks()"><i class="fa-solid fa-trash me-1"></i> Clear All</button>
      </div>
      <div id="taskList"></div>
    </div>

  </div>

  <script>
    function openDashboard() {
      document.getElementById('landingPage').style.display = 'none';
      document.getElementById('dashboardPage').style.display = 'block';
    }

    function openLanding() {
      document.getElementById('dashboardPage').style.display = 'none';
      document.getElementById('landingPage').style.display = 'flex';
    }
  </script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
